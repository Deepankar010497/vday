<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cute Valentine's Day page to ask someone to be your Valentine!">
  <meta name="theme-color" content="#ffd0e5">
  <title>Valentine's Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --rose-900: #7a1039;
      --rose-700: #b2184f;
      --rose-500: #e54b7d;
      --rose-200: #ffd3e5;
      --rose-100: #fff0f7;
      --gold-200: #f6e1b0;
      --ink: #2b1b22;
    }

    .gradient-background {
      background:
        radial-gradient(1200px 500px at 10% -20%, #ffe6f1 0%, rgba(255, 230, 241, 0) 60%),
        radial-gradient(900px 400px at 110% 10%, #fde9c9 0%, rgba(253, 233, 201, 0) 55%),
        linear-gradient(180deg, #fff1f7 0%, #ffe8f2 40%, #ffffff 100%);
      min-height: 100vh;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: var(--ink);
    }

    .valentine-card {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 211, 229, 0.9);
      box-shadow: 0 20px 60px rgba(122, 16, 57, 0.12);
      backdrop-filter: blur(10px);
    }

    .valentine-title {
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      letter-spacing: 0.5px;
    }

    .name-glow {
      color: var(--rose-700);
      text-shadow: 0 4px 18px rgba(229, 75, 125, 0.45);
    }

    .soft-divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, rgba(122, 16, 57, 0) 0%, #e54b7d 50%, rgba(122, 16, 57, 0) 100%);
      border-radius: 999px;
    }

    .fade-in {
      animation: fade-in 1.2s ease both;
    }

    .bounce {
      animation: bounce 2s ease infinite;
    }

    .float-slow {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <!-- Preload images so transitions feel instant -->
  <link rel="preload" as="image" href="./images/image1.gif">
  <link rel="preload" as="image" href="./images/image2.gif">
  <link rel="preload" as="image" href="./images/image3.gif">
  <link rel="preload" as="image" href="./images/image4.gif">
  <link rel="preload" as="image" href="./images/image5.gif">
  <link rel="preload" as="image" href="./images/image6.gif">
  <link rel="preload" as="image" href="./images/image7.gif">
</head>
<body class="gradient-background">
  <main class="flex items-center justify-center min-h-screen px-4 py-10">
    <section class="valentine-card fade-in flex flex-col items-center p-6 sm:p-10 rounded-[32px]">
      <div class="soft-divider mb-6"></div>
      <img
        id="imageDisplay"
        src="./images/image1.gif"
        alt="Cute kitten with flowers"
        class="float-slow rounded-2xl h-[280px] sm:h-[320px] object-cover shadow-xl"
      />
      <h1 id="valentineQuestion" class="valentine-title text-4xl sm:text-5xl font-semibold text-[var(--rose-900)] mt-6">
        Gugu, will you be my Valentine?
      </h1>
      <p class="text-base sm:text-lg text-[var(--rose-700)] mt-3 max-w-md text-center">
        My heart doesn’t just belong to you—it’s made of you.
      </p>
      <div id="responseButtons" class="flex gap-4 pt-5 items-center">
        <button
          id="yesButton"
          class="bounce inline-flex items-center justify-center whitespace-nowrap rounded-full text-xl font-semibold cursor-pointer px-5 py-2 bg-[var(--rose-500)] text-white transition-all duration-300 ease-in-out hover:bg-[var(--rose-700)] min-h-12 min-w-[90px] shadow-lg shadow-pink-200"
        >
          Yes
        </button>
        <button
          id="noButton"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-full text-xl font-medium cursor-pointer px-4 py-2 bg-white text-[var(--rose-700)] border border-[var(--rose-200)] transition-colors hover:bg-[var(--rose-100)] h-12 min-w-[90px]"
        >
          No
        </button>
      </div>
      <div class="soft-divider mt-6"></div>
    </section>
  </main>

  <script>
    (() => {
      // DOM references
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const imageDisplay = document.getElementById('imageDisplay');
      const valentineQuestion = document.getElementById('valentineQuestion');
      const responseButtons = document.getElementById('responseButtons');

      // Configuration
      const GROWTH_PER_CLICK = 35;
      const FONT_GROWTH_PER_CLICK = 25;
      const MAX_NO_CLICKS = 5;

      const IMAGE_PATHS = [
        './images/image1.gif',
        './images/image2.gif',
        './images/image3.gif',
        './images/image4.gif',
        './images/image5.gif',
        './images/image6.gif',
        './images/image7.gif',
      ];

      const NO_BUTTON_MESSAGES = [
        'No',
        'Are you sure?',
        'Pookie please',
        "Don't do this to me :(",
        "You're breaking my heart",
        "I'm gonna cry...",
      ];

      const ALT_TEXTS = [
        'Cute kitten with flowers',
        'Sad kitten looking up',
        'Kitten begging',
        'Heartbroken kitten',
        'Crying kitten',
        'Devastated kitten',
        'Happy kitten celebrating',
      ];

      // State
      let noClickCount = 0;
      let buttonHeight = 48;
      let buttonWidth = 80;
      let fontSize = 20;

      noButton.addEventListener('click', () => {
        if (noClickCount >= MAX_NO_CLICKS) return;

        noClickCount++;

        // Update image and alt text
        imageDisplay.src = IMAGE_PATHS[noClickCount];
        imageDisplay.alt = ALT_TEXTS[noClickCount];

        // Grow the "Yes" button to make it harder to ignore
        buttonHeight += GROWTH_PER_CLICK;
        buttonWidth += GROWTH_PER_CLICK;
        fontSize += FONT_GROWTH_PER_CLICK;

        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;

        // Update "No" button text with increasingly desperate messages
        noButton.textContent = NO_BUTTON_MESSAGES[noClickCount];
      });

      yesButton.addEventListener('click', () => {
        imageDisplay.src = IMAGE_PATHS[IMAGE_PATHS.length - 1];
        imageDisplay.alt = ALT_TEXTS[ALT_TEXTS.length - 1];
        valentineQuestion.textContent = 'Yayyy, Gugu!! :3';
        responseButtons.style.display = 'none';

        // Heart-shaped confetti for a valentine theme
        const heart = confetti.shapeFromPath({
          path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
        });

        const defaults = { spread: 360, ticks: 100, gravity: 0, decay: 0.94, startVelocity: 20, shapes: [heart], colors: ['#ff69b4', '#ff1493', '#ff6b81', '#e84393'] };

        confetti({ ...defaults, particleCount: 50, scalar: 2 });
        confetti({ ...defaults, particleCount: 25, scalar: 3 });
        confetti({ ...defaults, particleCount: 10, scalar: 4 });
      });
    })();
  </script>
</body>
</html>
